name: athkar
description: Athkar Application
publish_to: 'none'

version: 5.0.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  share_plus: ^7.2.2
  pdfx: ^2.9.2
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  cloud_firestore: ^5.4.4
  shared_preferences: ^2.3.2
  vibration: ^3.1.3
  google_fonts: ^6.3.0
  provider: ^6.1.2
  awesome_dialog: ^3.2.1
  connectivity_plus: ^6.0.5
  just_audio: ^0.9.42
  http: ^1.2.0
  page_transition: ^2.1.0
  confetti: ^0.8.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  firebase_messaging: ^15.1.3
  wakelock_plus: ^1.2.8
  fl_chart: ^1.1.1
  intl: ^0.19.0
  home_widget: ^0.6.0
  adhan: ^2.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  flutter_compass: ^0.8.0
  camera: ^0.11.4
  sensors_plus: ^7.0.0
  rive: ^0.14.3
  just_audio_background: ^0.0.1-beta.17

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/App_Icon.jpg"
  web:
    generate: true
    image_path: "assets/images/App_Icon.jpg"
    background_color: "#hexcode"
    theme_color: "#hexcode"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/
    - assets/files/wird_musafa.pdf
    - assets/database/
    - assets/images/
    - assets/sounds/
    - assets/sounds/common/
    - assets/sounds/evening/
    - assets/sounds/morning/
    - assets/sounds/sleeping/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri.ttf
    - family: Fantezy
      fonts:
        - asset: assets/fonts/Fantezy.ttf
